<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΠΑΔΑ – Κατάσταση Φοιτητή</title>

<style>
body {
  margin: 0;
  background: #f2f4f8;
  font-family: Arial, Helvetica, sans-serif;
}

.card {
  max-width: 700px;
  margin: 40px auto;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  padding: 24px;
}

.header {
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid #e5e7eb;
  padding-bottom: 16px;
}

.logo img {
  width: 70px;
  height: auto;
}

.uni {
  font-size: 18px;
  font-weight: bold;
  color: #0b3a8f;
}

.info {
  margin-top: 24px;
}

.label {
  font-size: 13px;
  color: #6b7280;
}

.value {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 16px;
  color: #111827;
}

.status {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 20px;
  background: #e6f9ee;
  color: #0f7a3a;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <div class="logo">
      <img src="logo-pada.jpg" alt="ΠΑΔΑ">
    </div>
    <div class="uni">ΠΑΝΕΠΙΣΤΗΜΙΟ ΔΥΤΙΚΗΣ ΑΤΤΙΚΗΣ</div>
  </div>

  <div class="info">
    <div class="label">Ονοματεπώνυμο</div>
    <div class="value">ΡΟΥΣΣΟΥ ΕΥΑΓΓΕΛΙΑ</div>

    <div class="label">Κωδικός</div>
    <div class="value">221461343176</div>

    <div class="label">Κατάσταση</div>
    <div class="status">ΕΝΕΡΓΗ</div>
  </div>

</div>

</body>
</html>
